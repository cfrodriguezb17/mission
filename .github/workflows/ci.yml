name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: datapulse_ci
          POSTGRES_USER: datapulse_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datapulse_ci -d datapulse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_POOL: 'false'
      POSTGRES_DB: datapulse_ci
      POSTGRES_USER: datapulse_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Validar Django y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py collectstatic --noinput
      - name: Validar OpenAPI sin advertencias
        run: python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/openapi.yaml"
      - name: Ejecutar pruebas de backend
        run: python manage.py test --noinput

  frontend:
    name: Frontend y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependencias con lockfile
        run: pnpm install --frozen-lockfile
      - name: Pruebas unitarias e integración
        run: |
          pnpm test:unit
          pnpm test:integration
      - name: Compilar producción con la configuración de Railway
        env:
          API_BASE_URL: https://mission-production-ab1c.up.railway.app/api
        run: |
          node tools/configure-production.mjs
          pnpm build

  e2e:
    name: Navegador con API real
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: datapulse_e2e
          POSTGRES_USER: datapulse_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datapulse_ci -d datapulse_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_POOL: 'false'
      POSTGRES_DB: datapulse_e2e
      POSTGRES_USER: datapulse_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DJANGO_REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Preparar API de pruebas
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_data
          python -m uvicorn backend.asgi:application --host 127.0.0.1 --port 8000 --lifespan off > "$RUNNER_TEMP/backend-e2e.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('La API de pruebas no inició')
          PY
      - name: Preparar navegador
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Ejecutar pruebas de navegador
        working-directory: frontend
        run: pnpm test:e2e
      - name: Guardar evidencia ante fallos
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend-e2e.log
          retention-days: 7
